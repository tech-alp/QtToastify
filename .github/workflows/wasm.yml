name: WASM CI and Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: '6.11.1'
  EMSCRIPTEN_VERSION: '4.0.7'

jobs:
  wasm:
    name: Build WebAssembly playground
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config

      - name: Cache Emscripten
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}

      - name: Install Emscripten
        run: |
          if [[ ! -x "${RUNNER_TEMP}/emsdk/emsdk" ]]; then
            git clone --branch "${EMSCRIPTEN_VERSION}" --depth 1 \
              https://github.com/emscripten-core/emsdk.git \
              "${RUNNER_TEMP}/emsdk"
          fi
          "${RUNNER_TEMP}/emsdk/emsdk" install "${EMSCRIPTEN_VERSION}"
          "${RUNNER_TEMP}/emsdk/emsdk" activate "${EMSCRIPTEN_VERSION}"

      - name: Install Qt for WebAssembly
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: wasm
          arch: wasm_singlethread
          cache: true
          cache-key-prefix: install-qt-action-qttoastify-wasm

      - name: Build WebAssembly playground
        run: |
          EMSDK_ROOT="${RUNNER_TEMP}/emsdk" \
          QT_WASM_PATH="${QT_ROOT_DIR}" \
          BUILD_DIR="${GITHUB_WORKSPACE}/build-wasm" \
          ./scripts/build_wasm.sh

      - name: Upload WebAssembly artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qttoastify-wasm
          path: build-wasm/site/
          if-no-files-found: error
          retention-days: 7

  pages:
    name: Assemble GitHub Pages site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Download WebAssembly artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qttoastify-wasm
          path: _site/wasm

      - name: Assemble site
        run: |
          touch _site/.nojekyll
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=wasm/">' \
            '<title>QtToastify Live Demo</title>' \
            '<a href="wasm/">Open the QtToastify WebAssembly demo</a>' \
            > _site/index.html
          test -s _site/index.html
          test -s _site/wasm/index.html
          test -s _site/wasm/QtToastifyPlayground.js
          test -s _site/wasm/QtToastifyPlayground.wasm
          test -s _site/wasm/qtloader.js
          test -s _site/wasm/qtlogo.svg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site/

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
