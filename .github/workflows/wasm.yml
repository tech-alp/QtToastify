name: WASM CI and Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: '6.11.1'
  EMSCRIPTEN_VERSION: '4.0.7'

jobs:
  wasm:
    name: Build WebAssembly playground
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config

      - name: Test WebAssembly packaging checks
        run: python3 tests/test_build_wasm.py

      - name: Cache Emscripten
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}

      - name: Install Emscripten
        run: |
          if [[ ! -x "${RUNNER_TEMP}/emsdk/emsdk" ]]; then
            git clone --branch "${EMSCRIPTEN_VERSION}" --depth 1 \
              https://github.com/emscripten-core/emsdk.git \
              "${RUNNER_TEMP}/emsdk"
          fi
          "${RUNNER_TEMP}/emsdk/emsdk" install "${EMSCRIPTEN_VERSION}"
          "${RUNNER_TEMP}/emsdk/emsdk" activate "${EMSCRIPTEN_VERSION}"

      - name: Install Qt for WebAssembly
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: wasm
          arch: wasm_singlethread
          cache: true
          cache-key-prefix: install-qt-action-qttoastify-wasm

      - name: Build WebAssembly playground
        run: |
          EMSDK_ROOT="${RUNNER_TEMP}/emsdk" \
          QT_WASM_PATH="${QT_ROOT_DIR}" \
          BUILD_DIR="${GITHUB_WORKSPACE}/build-wasm" \
          ./scripts/build_wasm.sh

      - name: Upload WebAssembly artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qttoastify-wasm
          path: build-wasm/site/
          if-no-files-found: error
          retention-days: 7

  pages:
    name: Assemble GitHub Pages site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Download WebAssembly artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qttoastify-wasm
          path: _site/wasm

      - name: Assemble site
        run: |
          touch _site/.nojekyll
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=wasm/">' \
            '<title>QtToastify Live Demo</title>' \
            '<a href="wasm/">Open the QtToastify WebAssembly demo</a>' \
            > _site/index.html
          test -s _site/index.html
          test -s _site/wasm/index.html
          test -s _site/wasm/QtToastifyPlayground.js
          test -s _site/wasm/QtToastifyPlayground.wasm
          test -s _site/wasm/qtloader.js
          test -s _site/wasm/qtlogo.svg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
